[pytest]
testpaths = tests

log_cli = 1
log_cli_level = INFO
log_cli_format = %(message)s

# The golden test generates a project in a temp directory and runs pytest inside it. Without
# this, that inner run inherits the outer rootdir and this very file, and collects the
# generator's own tests a second time.
norecursedirs = .git .venv build dist *.egg-info
